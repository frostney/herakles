name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Bun CI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Run Biome
        run: bunx biome ci .

      - name: Run typecheck
        run: bunx tsc --noEmit

      - name: Run full Fallow audit
        run: bunx fallow audit --ci

      - name: Run Fallow health report
        run: bunx fallow health --score --report-only --quiet
