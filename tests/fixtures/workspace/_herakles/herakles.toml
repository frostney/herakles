version = 2
root = "."
timezone = "Europe/London"

[github]
owners = []
remote_style = "ssh"
include_archived = true

[sync]
exclude_topics = ["no-sync"]
pin_topics = ["pinned", "current", "travel"]

[project."frostney-herakles"]
source = "github"
repo = "frostney/herakles"

[project."paid-api"]
source = "github"
repo = "frostney/paid-api"
state = "commercial"
tags = ["strategic"]

[project."old-tool"]
source = "github"
repo = "frostney/old-tool"

[project."local-spike"]
source = "local"
path = "local-spike"

[job.friday_summary]
schedule = "00 16 * * FRI"
mode = "summary"
output = "_reports/weekly/{iso_week}.md"
