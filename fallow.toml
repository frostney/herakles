entry = [
  "electrobun.config.ts",
  "src/cli/main.ts",
  "src/ui/desktop/main.ts",
  "src/ui/server/main.ts",
]

ignoreDependencies = ["bun-plugin-tailwind"]

# CodeRabbit reads .coderabbit.config.ts itself; nothing in the project imports
# it, and its @coderabbitai/config import resolves only inside CodeRabbit.
ignorePatterns = [".coderabbit.config.ts"]

[health]
maxCyclomatic = 20
maxCognitive = 20
maxCrap = 100
